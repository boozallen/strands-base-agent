# Strands Base Agent — Default Configuration
# ==============================================================================
# This is the canonical home for non-secret configuration. Edit this file to
# shape your agent (model, prompt, tools, MCP servers, sessions, etc.).
#
# Secrets and environment-specific runtime values (HOST, PORT, AWS credentials,
# OTEL endpoints, encryption keys) live in .env — see env.template.
#
# Overrides
# ---------
# Any key here can be overridden at runtime by an environment variable using
# the STRANDS__ prefix and double-underscore nesting that mirrors the YAML
# key path. Use overrides for per-environment tweaks; keep the file itself as
# the source of truth for the defaults.
#
#   YAML key path                Env var
#   -------------                -------
#   model.provider            -> STRANDS__MODEL__PROVIDER
#   model.model_id            -> STRANDS__MODEL__MODEL_ID
#   agent_name                -> STRANDS__AGENT_NAME
#   session_type              -> STRANDS__SESSION_TYPE
#
# Structured values (mcp_servers, a2a_servers, agent_state_initial_values) are
# awkward as flat env vars — keep them in YAML.

# Model
# ==============================================================================
model:
  provider: bedrock
  model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
  temperature: 0.3
  streaming: true
  # max_tokens: 4096
  # top_p: 0.9
  # region_name: us-east-1

  # Bedrock guardrails (off by default)
  # guardrails:
  #   guardrail_id: my-guardrail-id
  #   guardrail_version: "1"
  #   guardrail_trace: enabled

  # Ollama / llama.cpp endpoints — usually env-specific, prefer the
  # OLLAMA_URL / LLAMACPP_URL env vars in .env over hard-coding here.
  # ollama_url: http://localhost:11434
  # llamacpp_url: http://localhost:8080

# Agent identity
# ==============================================================================
agent_name: strands-base-agent
agent_description: A general-purpose AI agent powered by AWS Strands Agent framework
agent_version: "1.0"
# agent_port: 8000  # overrides PORT env var when set

system_prompt: >
  You are a helpful AI assistant powered by the AWS Strands Agent framework.
  You assist users by leveraging available tools and capabilities to provide
  accurate, helpful responses to their queries and tasks.

# Tools
# ==============================================================================
# Modules and/or files to load custom @tool-decorated functions from.
# tools_modules:
#   - strands_base_agent.tools
# tools_files:
#   - tools/extra_tools.py

# Conversation behavior
# ==============================================================================
# max_conversation_length: 10
# conversation_window_size: 100
# conversation_truncate_results: false

# Initial agent state — passed into the agent on construction.
# agent_state_initial_values:
#   user_preference: concise
#   context: development

# TLS posture (required). Values: platform, native
# platform: TLS terminated by ingress/service mesh (uvicorn serves HTTP)
# native: uvicorn terminates TLS (requires tls_keyfile and tls_certfile)
tls_mode: platform
# tls_keyfile: /path/to/key.pem
# tls_certfile: /path/to/cert.pem

# Memory / knowledge base (Bedrock)
# ==============================================================================
# enable_memory: false
# knowledge_base_id: KB-XXXXXXXX

# Sessions
# ==============================================================================
# Sessions are off by default. Uncomment to enable.
#
# session_type: file       # one of: file | s3 | dynamodb
# session_storage_dir: ./sessions       # for session_type=file
# session_s3_bucket: my-sessions-bucket # for session_type=s3
# session_s3_prefix: agents/strands     # for session_type=s3
# session_id: <auto-generated when omitted>
#
# When session_type=file, set SESSION_ENCRYPTION_KEY in .env (required).

# MCP servers (Model Context Protocol)
# ==============================================================================
# mcp_servers:
#   - name: github
#     url: https://api.githubcopilot.com/mcp/
#     headers:
#       Authorization: "Bearer YOUR_GITHUB_PAT"

# A2A servers (Agent-to-Agent clients this agent can call)
# ==============================================================================
# a2a_servers:
#   - name: example-agent
#     url: https://example-agent.com/api/

# Application settings
# ==============================================================================
log_level: INFO
# max_query_length: 2000
# default_similarity_threshold: 0.7
# max_response_time_ms: 30000

# Observability
# ==============================================================================
# Toggle OpenTelemetry export. The OTEL endpoint, headers, service name, and
# resource attributes themselves live in .env (env-specific).
observability_enabled: false
